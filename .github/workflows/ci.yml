name: Validate Skill

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate files and licenses
        run: python3 scripts/check_release.py
      - name: Test Meihua engine
        run: python3 -m unittest discover -s scripts/meihua-engine/tests -v
      - name: Test source variants
        run: python3 -m unittest discover -s scripts/source-variants/tests -v
